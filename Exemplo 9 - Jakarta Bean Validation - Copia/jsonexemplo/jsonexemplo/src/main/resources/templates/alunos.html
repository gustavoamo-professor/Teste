
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gestão Acadêmica</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

    <!-- ========================================= -->
    <!-- CABEÇALHO -->
    <!-- ========================================= -->

    <header>

        <h1>Sistema de Gestão Acadêmica</h1>

    </header>

    <!-- ========================================= -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ========================================= -->

    <main class="container">

        <!-- ===================================== -->
        <!-- MENU -->
        <!-- ===================================== -->

        <nav class="menu">

            <a class="botao botao-editar"
               th:href="@{/alunos}">
                Alunos
            </a>

            <a class="botao botao-editar"
               th:href="@{/cursos}">
                Cursos
            </a>

            <a class="botao botao-editar"
               th:href="@{/disciplinas}">
                Disciplinas
            </a>

            <a class="botao botao-editar"
               th:href="@{/matriculas}">
                Matrículas
            </a>

        </nav>

        <!-- ===================================== -->
        <!-- TÍTULO -->
        <!-- ===================================== -->

        <h2>Alunos cadastrados</h2>

        <!-- ===================================== -->
        <!-- MENSAGEM DE SUCESSO -->
        <!-- ===================================== -->

        <div
            class="mensagem mensagem-sucesso"
            th:if="${sucesso != null}"
            th:text="${sucesso}">
        </div>

        <!-- ===================================== -->
        <!-- MENSAGEM DE ERRO -->
        <!-- ===================================== -->

        <div
            class="mensagem mensagem-erro"
            th:if="${erro != null}"
            th:text="${erro}">
        </div>

        <!-- ===================================== -->
        <!-- PESQUISA -->
        <!-- ===================================== -->

        <form
            class="form-pesquisa"
            th:action="@{/alunos}"
            method="get">

            <div class="campo-pesquisa">

                <label for="pesquisa">
                    Pesquisar aluno
                </label>

                <input
                    id="pesquisa"
                    type="text"
                    name="nome"
                    th:value="${nomePesquisa}"
                    placeholder="Digite parte do nome">

            </div>

            <button
                class="botao botao-pesquisar"
                type="submit">

                Pesquisar

            </button>

            <a
                class="botao botao-voltar"
                th:href="@{/alunos}">

                Limpar

            </a>

        </form>

        <!-- ===================================== -->
        <!-- NENHUM RESULTADO -->
        <!-- ===================================== -->

        <div
            class="mensagem mensagem-erro"
            th:if="${alunos != null
                    and alunos.isEmpty()
                    and nomePesquisa != null
                    and !nomePesquisa.isBlank()}">

            Nenhum aluno encontrado.

        </div>

        <!-- ===================================== -->
        <!-- BOTÃO NOVO ALUNO -->
        <!-- ===================================== -->

        <div class="acoes">

            <a
                class="botao botao-novo"
                th:href="@{/alunos/novo}">

                + Novo aluno

            </a>

        </div>

        <!-- ===================================== -->
        <!-- TABELA DE ALUNOS -->
        <!-- ===================================== -->

        <div
            class="tabela-container"
            th:if="${alunos != null and !alunos.isEmpty()}">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Nome</th>

                        <th>Idade</th>

                        <th>Curso</th>

                        <th>E-mail</th>

                        <th>Matrícula</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="aluno : ${alunos}">

                        <!-- ID -->
                        <td th:text="${aluno.id}">
                        </td>

                        <!-- NOME -->
                        <td th:text="${aluno.nome}">
                        </td>

                        <!-- IDADE -->
                        <td th:text="${aluno.idade}">
                        </td>

                        <!-- CURSO -->
                        <td th:text="${aluno.cursoNome}">
                        </td>

                        <!-- EMAIL -->
                        <td th:text="${aluno.email}">
                        </td>

                        <!-- MATRÍCULA -->
                        <td th:text="${aluno.matricula}">
                        </td>

                        <!-- AÇÕES -->
                        <td>

                            <div class="acoes-tabela">

                                <!-- EDITAR -->

                                <a
                                    class="botao botao-editar"
                                    th:href="@{/alunos/{id}/editar(id=${aluno.id})}">

                                    Editar

                                </a>

                                <!-- EXCLUIR -->

                                <form
                                    th:action="@{/alunos/{id}/excluir(id=${aluno.id})}"
                                    method="post">

                                    <button
                                        class="botao botao-excluir"
                                        type="submit">

                                        Excluir

                                    </button>

                                </form>

                                <!-- MATRÍCULAS DO ALUNO -->

                                <a
                                    class="botao botao-pesquisar"
                                    th:href="@{/matriculas(alunoId=${aluno.id})}">

                                    Matrículas

                                </a>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- ===================================== -->
        <!-- CASO NÃO EXISTA NENHUM ALUNO -->
        <!-- ===================================== -->

        <div
            class="mensagem mensagem-erro"
            th:if="${alunos != null
                    and alunos.isEmpty()
                    and (nomePesquisa == null
                    or nomePesquisa.isBlank())}">

            Nenhum aluno cadastrado.

        </div>

    </main>

</body>

</html>
