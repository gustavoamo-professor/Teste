spring.application.name=jsonexemplo

# ---------- Banco H2 em arquivo (os dados sobrevivem ao reiniciar) ----------
spring.datasource.url=jdbc:h2:file:./data/academico
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---------- Para usar MySQL, troque as 4 linhas acima por: ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/academico?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=SUA_SENHA
# spring.jpa.hibernate.ddl-auto=update
# (e troque a dependência h2 por mysql-connector-j no pom.xml)

spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
