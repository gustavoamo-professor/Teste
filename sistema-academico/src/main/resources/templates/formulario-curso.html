<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Curso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: cabecalho}"></header>

<main class="container">

    <nav th:replace="~{fragments :: menu}"></nav>

    <h2 th:text="${titulo}">Curso</h2>

    <form class="formulario"
          th:action="@{${acao}}"
          th:object="${curso}"
          method="post">

        <div class="campo campo-completo">
            <label for="nome">Nome do curso</label>
            <input id="nome"
                   type="text"
                   th:field="*{nome}"
                   th:classappend="${#fields.hasErrors('nome')} ? 'input-erro'"
                   placeholder="Ex.: Sistemas de Informação">
            <span class="erro-campo"
                  th:if="${#fields.hasErrors('nome')}"
                  th:errors="*{nome}"></span>
        </div>

        <div class="acoes campo-completo">
            <button class="botao botao-salvar" type="submit">Salvar</button>
            <a class="botao botao-voltar" th:href="@{/cursos}">Voltar</a>
        </div>
    </form>

</main>
</body>
</html>
