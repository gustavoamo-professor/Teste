<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Académica</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Sistema de Gestão Académica</h1>
    </header>
    <main class="container">
        <!-- MENU DE NAVEGAÇÃO -->
        <nav class="menu">
            <a class="botao botao-editar" th:href="@{/alunos}">Alunos</a>
            <a class="botao botao-editar" th:href="@{/cursos}">Cursos</a>
            <a class="botao botao-editar" th:href="@{/disciplinas}">Disciplinas</a>
            <a class="botao botao-editar" th:href="@{/matriculas}">Matrículas</a>
        </nav>

        <h2>Alunos cadastrados</h2>

        <!-- TABELA DE ALUNOS -->
        <div class="tabela-container" th:if="${alunos != null and !alunos.isEmpty()}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Curso</th>
                        <th>E-mail</th>
                        <th>Matrícula</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aluno : ${alunos}">
                        <td th:text="${aluno.id}"></td>
                        <td th:text="${aluno.nome}"></td>
                        <td th:text="${aluno.idade}"></td>
                        <td th:text="${aluno.cursoNome}"></td>
                        <td th:text="${aluno.email}"></td>
                        <td th:text="${aluno.matricula}"></td>
                        <td>
                            <div class="acoes-tabela">
                                <a class="botao botao-pesquisar" th:href="@{/matriculas(alunoId=${aluno.id})}">
                                    Matrículas
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mensagem mensagem-erro" th:if="${alunos == null or alunos.isEmpty()}">
            Nenhum aluno cadastrado.
        </div>
    </main>
</body>
</html>
